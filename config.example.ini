; =============================================================================
;  RINEXClient 설정 템플릿
;
;  기준 문서
;    Go_RINEX_SFTP_통합_프로그램_설계안_Rev1.6.docx
;    SFTPClient_PROJECT_GUIDELINES.md
;    SFTPClient_LEDGER_CONCEPT.md
;    SFTPClient_SCAN_DESIGN_DECISIONS.md
;    SFTPClient_SECURITY_ENC_DESIGN.md
;    internal/ledger/schema.sql
;
;  이 파일은 템플릿이며 커밋 대상이다.
;  운영 시 config.example.ini 를 config.ini 로 복사해 실제 값으로 수정한다.
;  config.ini 는 .gitignore 로 제외하며 저장소에 커밋하지 않는다.
;
;  운영 config.ini 에는 실제 서버 접속 정보와 운영 경로가 포함될 수 있으므로
;  암호화 여부와 관계없이 운영 전용 파일로 취급한다.
;
;  -----------------------------------------------------------------------------
;  접속 정보 보호 — Windows DPAPI
;
;    운영 환경의 [PUT.SFTP] Host / User / Port 는 평문으로 저장하지 않는다.
;    Windows DPAPI LocalMachine 방식으로 보호한 enc: 값을 사용한다.
;
;      Host = enc:...
;      User = enc:...
;      Port = enc:...
;
;    보호 값 생성:
;
;      rinexclient.exe secure-set
;
;    명령을 실행한 뒤 값을 입력하고 Enter 를 누르면 enc:... 문자열이 출력된다.
;    Host / User / Port 각각 1회씩 생성하여 해당 키 값에 붙여 넣는다.
;
;    ★ secure-set 은 반드시 실제 프로그램이 실행될 Windows PC 에서 수행한다.
;      LocalMachine 스코프이므로 다른 PC 또는 Windows 재설치 환경에서는
;      기존 enc: 값의 복호화를 보장하지 않는다.
;      해당 경우 그 PC 에서 secure-set 으로 다시 생성한다.
;
;    이 템플릿의 Host / User / Port 예시는 설명·개발용 평문일 수 있다.
;    실제 기관 배포용 config.ini 에서는 반드시 enc: 값으로 교체한다.
;
;    평문 값을 사용해도 프로그램은 실행할 수 있으나,
;    Transport=sftp 인 경우 시작 시 [WARN] 이 기록된다.
;
;    enc: 값의 복호화에 실패하면 프로그램은 시작하지 않는다.
;    암호문을 평문 문자열로 간주하여 계속 실행하는 경로는 두지 않는다.
;
;  -----------------------------------------------------------------------------
;  상대 경로 기준
;
;    LedgerPath / PrivateKey / KnownHosts / Dir 등 상대 경로는
;    프로세스 작업 디렉터리(cwd)가 아니라
;    이 설정 파일(config.ini)이 있는 디렉터리를 기준으로 해석한다.
;
;    Windows 작업 스케줄러 등이 cwd 를 System32 등으로 두는 경우에도
;    exe 옆에 둔 config.ini · keys\ · data\ · logs\ 가 그대로 맞는다.
;    절대 경로를 쓰면 그 값을 그대로 사용한다.
;
;  -----------------------------------------------------------------------------
;  경로 토큰
;
;    (YYYY) 4자리 연도    2026
;    (YY)   2자리 연도    26
;    (DOY)  3자리 연중일  182, 001
;    (MM)   2자리 월      07
;    (DD)   2자리 일      01
;    (HH)   2자리 시      00
;
;    토큰 확장은 항상 UTC 기준이다. (internal/pathpl)
;    KST 로 해석하면 00:00~08:59 KST 가 전날 UTC 에 속해
;    엉뚱한 DOY 를 볼 수 있다.
;
;    (SITE) 토큰은 없다.
;    기관 경로에 관측소별 디렉터리가 없고 한 디렉터리에
;    여러 관측소 파일이 함께 놓인다.
;    관측소 단위 운영 조회가 필요한 경우 file_name 접두어를 사용한다.
;
;  ★ HourLayout 은 Hourly LocalPath 배치만 강제한다. (과도기)
;    MVP2에서 제거하고 범위 제한 재귀 탐색으로 교체한다.
;    Hourly (HH) 필수 검증을 재강화하지 않는다. 기관이 늘 때마다
;    배치 값을 추가하지 않는다.
;    Daily 는 (HH) 를 적지 않는다.
;
;      HourLayout=dir   LocalPath  ...\(YYYY)\(DOY)\(HH)\
;      HourLayout=flat  LocalPath  ...\(YYYY)\(DOY)\
;      Daily                       ...\(YYYY)\(DOY)\
;
;    Hourly RemotePath 는 (HH) 가 있어도 되고 없어도 된다.
;    소스 dir + 목적지 flat
;    (예: Local=...\(HH)\, Remote=/RNX2/) 을 허용한다.
;
;    Hourly LocalPath 가 HourLayout 과 어긋나면 시작 시 거부한다.
;    Daily 에 (HH) 가 있으면 Daily 구조와 맞지 않으므로 거부한다.
;
;    Hourly Scan 은 LocalPath 의 (HH) 유무로 순회한다.
;    있으면 날짜별로 HH=00~23 을 Expand 하고,
;    없으면 날짜 디렉터리를 한 번만 탐색한다.


[GENERAL]

; put | download | both
;
; 현재 구현 단계는 PUT 이다.
; download / both 는 현재 실행파일에서 시작 시 거부한다.
; 조용히 일부 기능만 동작시키지 않는다.
;
; 현재 알려진 구성은 서버에 프로그램을 설치하여 PUT 조합으로 처리할 수 있다.
; DOWNLOAD 는 원본 서버에 본 프로그램을 설치할 수 없는 구성에 대비해
; 구조만 유지하고 MVP3 에서 구현한다.
Mode = put

; 전송 계층: sftp(운영) | localfs(검증). 필수. 기본값은 두지 않는다.
;
; 운영은 rinexclient.exe 만 실행하고 이 값을 쓴다.
; --transport 는 테스트/점검용 override 이며 평상시 운영에는 필요 없다.
Transport = sftp

; DOWNLOAD 로 수신한 파일(origin=DOWNLOAD)을 다시 PUT 대상으로 삼을지 여부.
;
; 현재 PUT 전용 실행에서는 false 로 사용한다.
; BOTH 중계 구성이 구현되면 true 사용과
; DOWNLOAD Scan 경로 / PUT 송신 경로 중첩 검사를 활성화한다.
RepostDownloaded = false

; Ledger DB 파일 경로.
;
; 반드시 프로그램이 실행되는 서버의 로컬 디스크에 둔다.
; 원본 RINEX 파일은 SMB/NAS 에 있어도 무방하지만
; SQLite Ledger DB 는 네트워크 공유에 두지 않는다.
;
; 상대 경로면 config.ini 가 있는 디렉터리 기준이다. (파일 상단 주석)
;
; SQLite 는 DB 파일 자체는 생성할 수 있지만
; 존재하지 않는 상위 디렉터리까지 생성하지는 않는다.
; 따라서 상위 디렉터리 존재 여부를 시작 시 검사한다.
LedgerPath = data\rinex_ledger.db

; 중복 실행 방지 lock 의 stale 문턱(초).
;
; 프로그램은 시작 시 <LedgerPath>.lock 디렉터리를 만들고 그 안에
; 자기 owner 파일을 하나 남긴다. 정상 종료 시 자기 owner 파일만 지우고,
; 디렉터리가 비어 있을 때만 디렉터리를 지운다.
;
; 다른 인스턴스의 owner 가 살아 있으면 조용히 종료한다
; (스케줄러 회차 겹침은 장애가 아니다).
;
; 크래시·정전·강제종료는 owner 파일을 남긴다. 그 나이가 이 값을 넘으면
; 비정상 종료의 잔재로 판정하여 탈취한다 (WARN 로그가 남는다).
;
; ※ 손으로 정리할 때는 디렉터리를 통째로 강제 삭제하지 말고
;    안의 owner 파일을 확인한 뒤 지운다. 통째 삭제는 살아 있는 실행의
;    lock 을 파괴한다.
;
; ★ 실제 최장 실행 시간보다 넉넉히 길게 잡는다.
;    짧으면: 아직 살아 있는 장기 실행의 lock 을 탈취 → 이중 전송 (비가역)
;    길면:   크래시 후 그 시간 동안 매시 실행이 거부 → 전송 공백
;            (다음 정상 회차가 디스크−Ledger 계산으로 자동 복구)
;
;기본 10800 = 180분(3시간).
;현재는 지연 유입이 한 회차에 몰리는 운영 상황까지 고려한 보수적 초기값이다.
;최종값은 운영에서 실제 최장 실행시간을 계측한 뒤 재조정한다 —
;①+② 합산 최장 실행시간의 3배 이상 (운영 계약, resend v4 §6.4.
;MaxFilesPerRun 주석 참조).
;
;수동 resend 의 lock 대기 상한도 이 값이다: 10초 간격으로 재시도하며
;이 시간을 넘기면 오류로 끝난다 (반복 안내 5분, Ctrl+C 즉시 취소).
;
; 600(10분) 미만, 86400(24시간) 초과는 시작 시 거부한다.
LockStaleSeconds = 10800


[SCAN]

; Hot Scan 범위(일).
; 정상 정기 실행마다 탐색한다.
;
; 최근 자료의 지연 유입을 같은 날 또는 다음 실행에서 회수하기 위해
; 기본값을 2일로 둔다.
ScanRecentDays = 2

; Deep Scan 범위(일).
; 하루 1회 수행한다.
;
; 정상적인 늦은 유입은 최근 7일 범위에서 자동 회수한다.
; 이 범위를 넘어선 과거 데이터 처리는 운영자가 별도로 판단한다.
;
; 운영 후 Deep Scan 로그의 oldest_new 분포를 보고 필요하면 조정한다.
ScanDays = 7

; Deep Scan 수행 시각(0~23).
;
; ★ 서버 로컬시간 기준이다.
; 경로 토큰 계산은 UTC 이지만 스케줄러와 운영 시간대는 로컬시간이다.
;
; 정기 스케줄러가 시간당 1회 실행된다는 운영 전제에서
; 해당 시각의 실행을 Deep Scan 실행으로 사용한다.
; 별도의 scan_state 테이블은 두지 않는다.
DeepScanHour = 4

; 디렉터리 mtime 기반 Skip 여부.
;
; 현재 설계에서는 false 를 사용한다.
;
; 디렉터리 mtime 은 파일 생성뿐 아니라 삭제·정리 작업에도 변경될 수 있다.
; 장기간 보존되는 스토리지에서 이를 신규 데이터 신호로 사용하면
; 오래된 디렉터리를 다시 Scan하여 재전송 위험을 만들 수 있다.
;
; 따라서 Hot / Deep 이 지정한 범위를 직접 Scan한다.
UseDirMtimeSkip = false


[INGRESS]

; 파일 mtime 이 현재 시각으로부터 이 초 이상 지난 경우에만
; Ingress 후보로 인정한다.
;
; ; ★ 의미
;;    GraceSeconds > 0  →  now - mtime > GraceSeconds 일 때만 통과
;;    GraceSeconds = 0  →  Grace Time 검사를 끈다 (mtime 나이는 보지 않음)
;;                         size>0 · .part · Category 대조 등 다른 Ingress 검사는 그대로다.
;    0 미만은 시작 시 거부한다.
;
; Scanner 는 파일을 발견하는 역할만 하며
; size=0, .part, Grace 조건 등은 verify 가 판정한다.
;
; 최종 DOY/Hourly 경로에는 QC·배분 완료 파일이 놓이는 것이 정상이나,
; 서버로 전달되는 짧은 구간 또는 비정상 전송 잔여 파일을
; Scan 할 가능성은 있으므로 Grace 방어를 유지한다.
;
; Grace 만으로 모든 비정상 파일을 막을 수는 없다.
; 나중에 완전한 파일로 덮어써져 size 또는 mtime 이 달라지면
; Ledger revision 증가가 최종 회수 장치가 된다.
GraceSeconds = 60


[LEDGER]

; Ledger 행 보존기간(일).
;
; ★ 반드시 ScanDays 보다 길어야 한다.
;
;   RetentionDays <= ScanDays 인 상태에서 오래된 Ledger 행을 지우면
;   디스크에는 파일이 남아 있는데 Ledger에서만 사라질 수 있다.
;   이후 Scan에서 신규 파일로 판정되어 재전송될 수 있으므로
;   시작 시 거부한다.
;
; ★ 이 값이 장부로 과거를 신뢰할 수 있는 실질적인 안전 상한이다.
;
;   장부가 기억하지 못하는 과거 구간을 Scan하면
;   이미 전송한 파일도 신규처럼 보일 수 있다.
;
; 운영 권장 35일 (resend 설계 v4 §3.4, 2026-09-22).
;
;   이 값은 자동/수동 resend 창의 하한도 결정한다:
;     안전 하한 limit = UTC 오늘 − (RetentionDays − 2)
;   여유 2일은 Cleanup 직전의 날을 재전송 후보로 만들지 않기 위한
;   경계다. 35 로 두면 "약 한 달 전" 요청까지 수동 resend 가 받는다.
;   (30 이면 오늘−28 까지만 허용되어, 월초에 지난달 초 요청이 거부된다.)
;
; 종전 운영 기준 30일(서울시·측위원 1개월 보존)에서 위 근거로 +5일.
;
; Retention Cleanup 은 MVP2에서 구현한다.
; 현재 RetentionDays 값은 보존 정책·시작 시 불변식 검증·resend 창 계산에
; 사용한다.
;
; SQLite DELETE 는 free page 를 재사용할 뿐
; DB 파일 크기를 즉시 줄이지 않는다.
; VACUUM 은 정기 실행하지 않는다.
RetentionDays = 35


[PUT]

; 파일 전송 병렬도.
;
; Scan은 항상 순차로 수행한다.
; 전송은 bounded Worker Pool 으로 병렬 처리하며
; 기본값은 4이다.
;
; 후속 성능 개선에서 Worker 수를 비교하여
; 필요하면 운영 기본값을 다시 조정한다.
MaxWorkers = 4

; 동일 파일(동일 revision)에 허용하는 누적 자동 전송 시도 횟수.
; 첫 전송 시도를 포함한다. MaxRetries = 5 면 총 5회까지 자동 시도한다.
;
; 한 실행 안에서는 재시도하지 않는다. 실패한 파일은 다음 정기 실행
; (1시간 뒤)에서 다시 시도된다 — 스케줄러가 곧 재시도 간격이다.
;
; 누적 5회 실패는 회선 순단이 아니라 권한·경로 설정류의 운영 장애다.
; 상한 도달 항목은 FAILED 로 남고 자동 후보에서 빠진다.
; MaxRetries < 1 은 시작 시 거부한다 (시도 0회는 허용하지 않는다).
MaxRetries = 5

; 한 번의 실행에서 실제 전송할 최대 파일 수 — ①(정시 put)과
; ②(자동 resend)의 "합산" 예산이다 (resend v4 §6.2):
;   ② 예산 = MaxFilesPerRun − ①의 선택 수. 남지 않으면 ② 는
;   [RESEND] skipped (budget=0) 으로 조용히 넘어간다.
; 수동 resend 는 이 값 전체를 예산으로 쓴다 (한 번 실행 = 한 배치).
; 0 이면 양쪽 모두 제한 없음 — 정기 실행에서는 쓰지 않는다.
;
; ★ 운영 계약 (v4 §6.4): 이 상한은 "①+② 합산 회차가 정시 간격
;   1시간 안에 끝나는" 크기로 튜닝하고, LockStaleSeconds 는 그
;   최장 실행시간의 3배 이상 여유를 둔다. 회차가 길어지면 상한을
;   늘리는 게 아니라 절단을 줄이도록 이 값을 내리는 방향이 기본이다.
;   (별도의 stale 근접 가드·heartbeat 는 두지 않는다 — 기각 근거 §6.4.)
;
; 초과분은 다음 정기 실행에서 계속 처리한다.
; 제한에 걸렸다면 WARN 로그를 남긴다.
;
; 2000은 초기 안전값이며 운영량을 계측한 뒤 조정할 수 있다.
MaxFilesPerRun = 2000

; 한 번의 실행에서 자연 백필(지문 없는 기존 행의 content_hash 채우기)로
; 해시를 계산할 최대 파일 수.
;
;   키를 지우면      → 500 (기본). 실행파일만 교체해도 백필이 작동한다.
;   0                → 백필 끔
;   양수             → 해당 상한
;   음수             → 시작 거부
;
; 판정 해시(size 같음 · mtime 다름)와 신규/변경/전송 후보의 필수 해시는
; 이 예산과 무관하다 — 그것은 방어의 본체다. (UNIT2 설계 v3 §3)
MaxHashBackfillPerRun = 500


[PUT.SFTP]

; SFTP 접속 정보는 방향 아래에 둔다.
;
; 향후 BOTH 모드에서는 DOWNLOAD 서버와 PUT 서버가 서로 다를 수 있으므로
; [PUT.SFTP] / [DOWNLOAD.SFTP] 를 독립적으로 구성한다.

; 현재 기본 인증 방식.
; publickey 만 허용한다. 다른 값은 시작 시 거부한다.
AuthMethod = publickey

Host = 192.168.0.1
Port = 22
User = rinexclient

; 설정 파일에 평문 비밀번호를 두지 않는다.
; 무인 실행에서는 Passphrase 없는 개인키 + OS 파일 접근권한 보호를
; 기본 조합으로 사용한다.
;
; 상대 경로면 config.ini 가 있는 디렉터리 기준이다.
;
; Transport=sftp 일 때만 경로와 파일 존재를 검사한다.
; Transport=localfs 이면 이 키 파일 존재 검사를 요구하지 않는다.
; Linux 전용 권한 강제(예: 600)는 선제 구현하지 않는다.
; 공식 보안점검에서 요구가 나온 경우에만 적용한다.
PrivateKey = keys\id_ed25519

; SSH host key 검증 파일.
;
; Transport=sftp 이면 경로가 비어 있거나 파일이 존재하지 않을 때 시작 시 거부한다.
; host key 검증을 비활성화하는 옵션은 두지 않는다.
; Transport=localfs 이면 이 파일 존재 검사를 요구하지 않는다.
KnownHosts = keys\known_hosts

; 원격 무진행 감시 문턱 (초). UNIT3 스톨 방어.
;
; 진행 중인 원격 작업이 있는데 이 시간 동안 진전(청크 쓰기, 원격 호출
; 완료)이 없으면 회차를 중단하고 SSH 연결을 닫는다. 중단된 파일은
; FAILED 로 기록되어 다음 정시 회차가 재시도한다.
;
; 생략 시 30. 허용 범위 5~600. 감시를 끄는 값은 없다 — 사실상
; 비활성이 필요하면 600 으로 키운다.
;
; 값을 키우면 스톨 회차가 그만큼 오래 큐를 잡고 있다가 끝난다.
; 막힌 회차는 빨리 접고 다음 정시에 재시도하는 쪽이 낫다.
StallTimeoutSeconds = 30


; -----------------------------------------------------------------------------
;  Category 섹션
;
;  섹션명은 schema.sql 의 category CHECK 값과 정확히 일치해야 한다.
;
;    RINEX2_DAILY
;    RINEX2_HOURLY
;    RINEX3_DAILY
;    RINEX3_HOURLY
;    RINEX4_DAILY
;    RINEX4_HOURLY
;
;  Scanner 는 Category 를 파일명에서 결정하지 않는다.
;  현재 섹션의 Category 를 Entry와 함께 상위 흐름에 전달한다.
;
;  verify의 Category 검증:
;
;    RINEX2
;      짧은 파일명의 세션 코드로 Daily/Hourly를 판별한다.
;      '0'은 Daily, 'a'~'x'는 Hourly다.
;
;    RINEX3 / RINEX4
;      긴 파일명의 기간 필드 01D / 01H로 Daily/Hourly를 판별한다.
;      파일명만으로 RINEX3과 RINEX4의 버전 자체를 구분하지 않는다.
;
;    명확한 주기 불일치나 short/long 파일명 계열 혼합은
;    CategoryMatchMismatch로 거부한다.
;    판별 근거가 부족한 이름은 CategoryMatchUnknown으로 처리하며,
;    Category 불일치만을 이유로 거부하지 않는다.
;
;    이 Category 검증과 세트 완성도 게이트는 별개다.
;    Category 검증 통과가 세트 게이트의 전송 허용을 뜻하지 않는다.
;
;  정상 운영에서는 RINEX2 / RINEX3 / RINEX4 물리 경로가 분리되어 있다는
;  운영 전제를 따른다.
;
;  ★ 아래 경로는 형태 예시다.
;    기관 반입 전에 실제 LocalPath / RemotePath 를 확정한다.
;    해당 기관에 없는 Category 는 Enabled = false 로 둔다.
;
;  ★ RemotePath 형태
;
;      전체 파일시스템 노출 → /E:/RINEX2Outgoing/...
;      E:\ 로 chroot        → /RINEX2Outgoing/...
;
;    어떤 형태인지는 SFTPGo 계정의 Home/Chroot 구성에 따라 다르며
;    코드에서 기관별 분기하지 않고 Config 값으로 처리한다.
;
;  Enabled=false 인 섹션도 Path Template 문법 자체는 검사한다.
; -----------------------------------------------------------------------------


[PUT.RINEX2_DAILY]

Enabled    = true
LocalPath  = D:\RINEX-V2-D\(YYYY)\(DOY)\
RemotePath = /RINEX2Outgoing/Daily/(YYYY)/(DOY)/


[PUT.RINEX2_HOURLY]

Enabled    = true
HourLayout = dir                                   ; dir | flat
LocalPath  = D:\RINEX-V2-H\(YYYY)\(DOY)\(HH)\
RemotePath = /RINEX2Outgoing/Hourly/(YYYY)/(DOY)/(HH)/


[PUT.RINEX3_DAILY]

Enabled    = true
LocalPath  = D:\RINEX-V3-D\(YYYY)\(DOY)\
RemotePath = /RINEX3Outgoing/Daily/(YYYY)/(DOY)/


[PUT.RINEX3_HOURLY]

Enabled    = true
HourLayout = dir                                   ; dir | flat
LocalPath  = D:\RINEX-V3-H\(YYYY)\(DOY)\(HH)\
RemotePath = /RINEX3Outgoing/Hourly/(YYYY)/(DOY)/(HH)/

[PUT.RINEX4_DAILY]
Enabled = false
LocalPath = D:\RINEX-V4-D\(YYYY)\(DOY)\
RemotePath = /RNXOutgoing/V4/(YYYY)/(DOY)/

[PUT.RINEX4_HOURLY]
Enabled = false
HourLayout = dir    ; dir | flat
LocalPath = D:\RINEX-V4-H\(YYYY)\(DOY)\(HH)\
RemotePath = /RNXOutgoing/V4/(YYYY)/(DOY)/(HH)/


; =============================================================================
; [SET.RINEXx] 세트 완성도 게이트 (Set Completeness Gate)
;
;   RequiredKinds 값의 의미:
;     false    : 세트 검사 OFF. 기존과 동일하게 파일 단위로 전송한다.
;     CSV 목록 : 게이트 ON. 지정한 kind가 모두 존재하는 세트만 전송을 시작한다.
;                (예: G,L,N,O / MO,MN) 대문자·소문자 모두 허용한다.
;     빈 값과 true는 허용하지 않는다(설정 오류).
;
;   정책은 버전별로 한 번 설정한다. Daily/Hourly 카테고리에 함께 적용된다.
;   기본값은 세 버전 모두 false다.
;   실서버에서 사용할 버전은 false를 해당 환경의 필수 kind 목록으로 바꾼다.
;
;   섹션이 없으면 OFF와 같다. 단, 섹션을 두었으면 RequiredKinds 키는
;   필수다 — 머리만 적고 키를 빠뜨린 절반짜리 설정은 시작 시 거부한다.
;   게이트 활성화 운영 절차는 현재 개발 산출물이 아니다.
;   게이트를 켤지는 별도의 운영 결정이며, 절차를 선제 구현하지 않는다.
;
;   ResendMinKinds (선택 키, 게이트 ON에서만 허용 — RESEND 설계 v4 §5):
;     resend 단계의 조건부 게이트 우회 최소 kind 목록이다.
;     미완성 세트라도 이 목록의 kind가 모두 있으면 resend가 전송한다.
;     RequiredKinds의 부분집합이어야 한다. (권장: RINEX2=O, RINEX3=MO)
;     키를 지우면 resend는 게이트를 무조건 우회한다.
;     게이트 OFF(false)에서 이 키를 적으면 시작 오류다 — 그래서
;     아래 기본(OFF) 예시에는 이 키가 없다.
;     예)  RequiredKinds  = G,L,N,O
;          ResendMinKinds = O
;
;   필수 kind가 누락된 세트는 전송을 보류한다.
;   전송 시작 후 일부 파일이 실패하면 기존 재시도 정책으로 처리한다.
;   이미 전송한 원격 파일을 되돌리지는 않는다.
; =============================================================================

[SET.RINEX2]
RequiredKinds = false

[SET.RINEX3]
RequiredKinds = false

[SET.RINEX4]
RequiredKinds = false


[LOG]

; debug | info | warn | error
Level = info

; 상대 경로면 config.ini 가 있는 디렉터리 기준이다.
Dir = logs

; 로그 파일 보존기간(일).
; Ledger RetentionDays 와는 별개의 값이다.
; 현재 저장소에는 로그 파일을 지우는 구현이 없다.
RetentionDays = 30

; 성공 파일은 개별 로그보다 집계를 우선하고,
; 실패와 Retry 는 원인을 상세히 기록한다.
;
; Scan 요약 로그 예:
;
;   [SCAN] cat=RINEX3_HOURLY mode=hot
;          dirs=48 files=5760
;          list=1.2s ledger=0.3s total=1.5s
;          errs=0
;
; Deep Scan 은 추가로 oldest_new 를 남긴다.
;
;   oldest_new=2026-08-23
;
; 이 값의 운영 분포를 보고 ScanDays=7을 재조정한다.


; =============================================================================
;  시작 시 거부 목록
;
;  아래는 실행을 계속하면 결과가 조용히 잘못될 수 있으므로
;  Config Load/Validate 단계에서 즉시 중단한다.
;
;    알 수 없는 Mode
;
;    Mode=download 또는 Mode=both
;      → 현재 실행파일에는 DOWNLOAD 미구현 (MVP3)
;
;    Transport 가 sftp 또는 localfs 가 아님
;
;    AuthMethod 가 publickey 가 아님
;      → publickey 만 허용. Transport=sftp 일 때만 검사한다.
;
;    Hourly Category에서 HourLayout=dir인데 LocalPath에 (HH)가 없음
;
;    Hourly Category에서 HourLayout=flat인데 LocalPath에 (HH)가 있음
;
;      → Hourly LocalPath는 HourLayout과 일치해야 한다.
;        Hourly RemotePath는 (HH)가 있어도 되고 없어도 된다.
;
;    Daily Category에서 LocalPath 또는 RemotePath에 (HH)가 있음
;
;    알 수 없는 Path Template 토큰 또는 잘못된 괄호
;      → internal/pathpl.Parse 가 거부
;
;    ScanRecentDays <= 0
;    ScanDays <= 0
;    ScanRecentDays > ScanDays
;
;    DeepScanHour 가 0~23 밖
;
;    GraceSeconds < 0
;      → 0 은 Grace 끔으로 허용. 음수만 거부
;
;    RetentionDays <= ScanDays
;
;    MaxWorkers 가 1~16 범위를 벗어남
;    MaxRetries < 1
;      → 시도 횟수는 최소 1. 0 은 거부
;    MaxFilesPerRun < 0
;    MaxHashBackfillPerRun < 0
;
;    LedgerPath 가 비어 있음
;    LedgerPath 상위 디렉터리가 존재하지 않음
;
;    Transport=sftp 인데 PUT.SFTP 필수값이 비어 있음
;    Transport=sftp 인데 Port 가 유효 범위를 벗어남
;    Transport=sftp 인데 PrivateKey 또는 KnownHosts 경로가 비어 있거나
;    파일이 존재하지 않음
;      → Transport=localfs 이면 SFTP 키 파일 존재 검사는 요구하지 않는다.
;
;    활성화된 PUT Category 가 0개
;
;  향후 BOTH 구현 시 추가되는 시작 검증:
;
;    RepostDownloaded=true 인데
;    PUT 송신 경로가 DOWNLOAD Scan 범위와 겹침
;      → Ping-Pong 가능성이 있으므로 거부
;
;  -----------------------------------------------------------------------------
;  시작 시 거부하지 않는 것
;
;    특정 날짜 / 시간으로 확장한 LocalPath 가 존재하지 않음
;
;      예:
;        ...\2026\240\05\
;
;      해당 시간 자료가 아직 없을 수 있으므로
;      fs.ErrNotExist 는 정상적인 빈 슬롯으로 처리한다.
;
;    단, Category Root 자체가 접근 불가능하거나
;    권한 오류 / NAS 마운트 단절 등으로 Category 전체를 신뢰할 수 없는 경우는
;    단순 빈 슬롯과 구분하여 실행 결과에 오류로 반영한다.
;
;    Category Scan 결과 files=0
;
;      즉시 Config 오류로 보지는 않는다.
;      다만 환경 이상 가능성이 있으므로 WARN 로그를 남긴다.
; =============================================================================
